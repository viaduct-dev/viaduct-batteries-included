[tools]
java = "21"
podman = "latest"
"ubi:supabase/cli" = { version = "2.104.0", exe = "supabase" }
"pipx:render-cli" = "latest"

[env]
# Podman configuration - dynamically detect socket path
DOCKER_HOST = "{{exec(command='.mise/scripts/get-podman-socket.sh')}}"

# Backend environment (Viaduct/Kotlin)
SUPABASE_URL = "http://127.0.0.1:54321"
SUPABASE_ANON_KEY = "sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH"
SUPABASE_SERVICE_ROLE_KEY = "sb_secret_N7UND0UgjKTVK-Uodkm0Hg_xSvEMPvz"

# Frontend environment (Vite/React)
VITE_SUPABASE_URL = "http://127.0.0.1:54321"
VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH"
VITE_SUPABASE_PROJECT_ID = "mgmfegesdvielbmhixcz"

# Dependency startup tasks
[tasks.podman-start]
description = "Start Podman and its Docker-compatible API"
run = """
if ! bash .mise/scripts/start-podman.sh; then
  echo ""
  echo "Podman failed to start. Collecting diagnostics..."
  bash .mise/scripts/diagnose-local-deps.sh || true
  exit 1
fi
"""

[tasks.supabase-start]
description = "Start the local Supabase project"
run = "bash .mise/scripts/start-supabase.sh"

[tasks.deps-start]
description = "Start all dependencies (Podman + Supabase)"
depends = ["supabase-start"]

# Build tasks
[tasks.build-backend]
description = "Build Viaduct GraphQL backend"
dir = "backend"
run = "./gradlew clean build"

[tasks.build-frontend]
description = "Build React frontend"
run = "npm run build"

[tasks.build]
description = "Build both backend and frontend"
depends = ["build-backend", "build-frontend"]

# Application tasks
[tasks.backend]
description = "Build and start Viaduct GraphQL backend"
depends = ["deps-start"]
dir = "backend"
run = "./gradlew clean run"

[tasks.frontend]
description = "Start React frontend (with Vite hot-reload)"
run = "npm run dev"

[tasks.dev]
description = "Start full development environment (dependencies + backend + frontend)"
run = """
echo "Starting dependencies..."
mise run deps-start
echo "Starting backend in background..."
mise run backend &
BACKEND_PID=$!
echo "Starting frontend..."
mise run frontend &
FRONTEND_PID=$!
echo "Development environment running!"
echo "Backend PID: $BACKEND_PID"
echo "Frontend PID: $FRONTEND_PID"
wait
"""

# Cleanup tasks
[tasks.kill-dev]
description = "Kill running backend and frontend processes"
run = """
echo "Killing backend processes..."
pkill -f "gradlew.*run" || echo "No backend process found"
echo "Killing frontend processes..."
pkill -f "vite" || echo "No frontend process found"
echo "Development processes stopped"
"""

[tasks.stop]
description = "Stop local Supabase and, on macOS, the Podman machine"
run = """
echo "Stopping the batteries-included Supabase project..."
.mise/scripts/supabase.sh stop --workdir "$(pwd)"
if [ "$(uname -s)" = "Darwin" ]; then
  echo "Stopping Podman machine..."
  podman machine stop
else
  echo "Leaving the native Podman service running."
fi
"""

[tasks.restart]
description = "Restart development environment (kill running processes and start fresh)"
run = """
echo "Restarting development environment..."
mise run kill-dev
echo "Starting fresh development environment..."
mise run dev
"""

[tasks.status]
description = "Check status of all services"
run = "bash .mise/scripts/diagnose-local-deps.sh"

[tasks.test]
description = "Run backend tests (Gradle starts Supabase containers automatically)"
dir = "backend"
run = "./gradlew test"

[tasks.get-docker-host]
description = "Print the current DOCKER_HOST value"
run = "bash .mise/scripts/get-podman-socket.sh"

[tasks.diagnose-podman]
description = "Diagnose Podman, its API socket, and local Supabase"
run = "bash .mise/scripts/diagnose-local-deps.sh"
