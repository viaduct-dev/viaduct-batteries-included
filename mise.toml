[tools]
java = "21"
podman = "latest"
"ubi:supabase/cli" = { version = "latest", exe = "supabase" }
"ubi:cloudflare/cloudflared" = { version = "latest", exe = "cloudflared" }
# ngrok is installed by `mise run tunnel-setup` into ~/.local/bin/ngrok (not in mise registry)

[env]
# Podman configuration - dynamically detect socket path
DOCKER_HOST = "{{exec(command='.mise/scripts/get-podman-socket.sh')}}"

# Backend environment (Viaduct/Kotlin)
SUPABASE_URL = "http://127.0.0.1:54321"
SUPABASE_ANON_KEY = "sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH"
SUPABASE_SERVICE_ROLE_KEY = "sb_secret_N7UND0UgjKTVK-Uodkm0Hg_xSvEMPvz"

# ngrok stable domain for GitHub OAuth tunneling
# NGROK_AUTHTOKEN must be set in your shell or .env.local (never commit it)
NGROK_DOMAIN = "veneering-unbitten-hemstitch.ngrok-free.dev"

# Frontend environment (Vite/React)
VITE_SUPABASE_URL = "http://127.0.0.1:54321"
VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH"
VITE_SUPABASE_PROJECT_ID = "mgmfegesdvielbmhixcz"

# Dependency startup tasks
[tasks.podman-start]
description = "Start Podman machine"
run = """
# Start podman machine if not running
podman machine start 2>&1 || echo 'Podman already running'
# Verify socket is accessible
if ! podman info >/dev/null 2>&1; then
  echo "WARNING: Podman socket not accessible. Checking connections..."
  podman system connection list
  echo "Waiting for socket to be ready..."
  sleep 2
fi
"""

[tasks.supabase-start]
description = "Start local Supabase"
depends = ["podman-start"]
run = "supabase start"

[tasks.deps-start]
description = "Start all dependencies (Podman + Supabase)"
depends = ["supabase-start"]

# Build tasks
[tasks.build-backend]
description = "Build Viaduct GraphQL backend"
dir = "backend"
run = "./gradlew clean build"

[tasks.build-frontend]
description = "Build React frontend"
run = "npm run build"

[tasks.build]
description = "Build both backend and frontend"
depends = ["build-backend", "build-frontend"]

# Application tasks
[tasks.backend]
description = "Build and start Viaduct GraphQL backend"
depends = ["deps-start"]
dir = "backend"
run = "./gradlew clean run"

[tasks.frontend]
description = "Start React frontend (with Vite hot-reload)"
run = "npm run dev"

[tasks.dev]
description = "Start full development environment (dependencies + backend + frontend)"
run = """
echo "Starting dependencies..."
mise run deps-start
echo "Starting backend in background..."
mise run backend &
BACKEND_PID=$!
echo "Starting frontend..."
mise run frontend &
FRONTEND_PID=$!
echo "Development environment running!"
echo "Backend PID: $BACKEND_PID"
echo "Frontend PID: $FRONTEND_PID"
wait
"""

# Cleanup tasks
[tasks.kill-dev]
description = "Kill running backend and frontend processes"
run = """
echo "Killing backend processes..."
pkill -f "gradlew.*run" || echo "No backend process found"
echo "Killing frontend processes..."
pkill -f "vite" || echo "No frontend process found"
echo "Development processes stopped"
"""

[tasks.stop]
description = "Stop all services"
run = """
echo "Stopping Supabase..."
supabase stop
echo "Stopping Podman..."
podman machine stop
"""

[tasks.restart]
description = "Restart development environment (kill running processes and start fresh)"
run = """
echo "Restarting development environment..."
mise run kill-dev
echo "Starting fresh development environment..."
mise run dev
"""

[tasks.status]
description = "Check status of all services"
run = """
echo "=== Podman Status ==="
podman machine list
echo ""
echo "=== Podman Connection Info ==="
podman system connection list
echo ""
echo "=== Supabase Status ==="
supabase status
"""

[tasks.tunnel-setup]
description = "One-time setup: install ngrok, save authtoken, and claim your free static domain"
run = """
set -e
# Install ngrok if not present
NGROK_BIN="$HOME/.local/bin/ngrok"
if [ ! -x "$NGROK_BIN" ]; then
  echo "Installing ngrok..."
  mkdir -p "$HOME/.local/bin"
  curl -sSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-darwin-amd64.zip -o /tmp/ngrok.zip
  unzip -o /tmp/ngrok.zip -d "$HOME/.local/bin"
  rm /tmp/ngrok.zip
  echo "ngrok installed to $NGROK_BIN"
fi

if [ -z "${NGROK_AUTHTOKEN}" ]; then
  echo ""
  echo "Next steps:"
  echo "  1. Sign up / log in at https://dashboard.ngrok.com"
  echo "  2. Copy your authtoken from https://dashboard.ngrok.com/authtokens"
  echo "  3. Set NGROK_AUTHTOKEN in mise.toml"
  echo "  4. Claim your free static domain at https://dashboard.ngrok.com/domains"
  echo "  5. Set NGROK_DOMAIN in mise.toml"
  echo "  6. Re-run: mise run tunnel-setup"
  exit 0
fi

$NGROK_BIN config add-authtoken ${NGROK_AUTHTOKEN}
echo ""
echo "Auth token saved."
echo ""
echo "Your GitHub OAuth callback URL will be:"
echo "  https://${NGROK_DOMAIN}/auth/v1/callback"
"""

[tasks.tunnel]
description = "Start stable ngrok tunnel exposing local Supabase on your static domain"
run = """
NGROK_BIN="$HOME/.local/bin/ngrok"
if [ ! -x "$NGROK_BIN" ]; then
  echo "ngrok not installed — run 'mise run tunnel-setup' first."
  exit 1
fi
if [ -z "${NGROK_AUTHTOKEN}" ] || [ -z "${NGROK_DOMAIN}" ]; then
  echo "ERROR: Set NGROK_AUTHTOKEN and NGROK_DOMAIN in mise.toml first."
  echo "Run 'mise run tunnel-setup' to get started."
  exit 1
fi
echo "Starting tunnel: https://${NGROK_DOMAIN} -> http://127.0.0.1:54321"
echo "GitHub OAuth callback URL: https://${NGROK_DOMAIN}/auth/v1/callback"
echo ""
$NGROK_BIN http --domain=${NGROK_DOMAIN} 54321
"""

[tasks.test]
description = "Run backend tests (Gradle starts Supabase containers automatically)"
dir = "backend"
run = "./gradlew test"

[tasks.diagnose-podman]
description = "Diagnose Podman socket configuration"
run = """
echo "=== Running Podman Diagnostics ==="
echo ""
echo "=== Podman Machine Info ==="
podman machine list
echo ""
echo "=== Podman Connection Info ==="
podman system connection list
echo ""
echo "=== Checking Socket Paths ==="
if [ -d /tmp/podman ]; then
  echo "Found /tmp/podman directory:"
  ls -la /tmp/podman/*.sock 2>/dev/null || echo "No sockets found in /tmp/podman"
else
  echo "/tmp/podman directory not found"
fi
echo ""
echo "=== Environment Variables ==="
echo "DOCKER_HOST: $DOCKER_HOST"
echo ""
echo "=== Podman Info (checking connectivity) ==="
if podman info >/dev/null 2>&1; then
  echo "✓ Podman is accessible"
  echo "Podman Version: $(podman version --format json | grep -o '"Version":"[^"]*' | head -1 | cut -d'"' -f4)"
else
  echo "✗ Cannot connect to Podman"
fi
"""
